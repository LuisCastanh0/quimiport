services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quimiport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quimiport}
      POSTGRES_DB: ${POSTGRES_DB:-quimiport}
    ports:
      - "5432:5432"
    volumes:
      - quimiport_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quimiport} -d ${POSTGRES_DB:-quimiport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-quimiport}:${POSTGRES_PASSWORD:-quimiport}@db:5432/${POSTGRES_DB:-quimiport}?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER:-quimiport}:${POSTGRES_PASSWORD:-quimiport}@db:5432/quimiport_test?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  quimiport_pgdata:
